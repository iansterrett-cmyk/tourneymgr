<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 2rem;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-content {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    @media (min-width: 640px) {
      .brand {
        width: auto;
      }
    }

    .menu-toggle {
      display: block;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      font-size: 1.25rem;
      border-radius: 6px;
    }

    @media (min-width: 640px) {
      .menu-toggle {
        display: none;
      }
    }

    nav {
      display: none;
      width: 100%;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    nav.open {
      display: flex;
    }

    @media (min-width: 640px) {
      nav {
        display: flex !important;
        flex-direction: row;
        width: auto;
        margin-top: 0;
        gap: 0.5rem;
      }
    }

    nav button {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      width: 100%;
      text-align: left;
      padding: 0.6rem 0.75rem;
    }

    @media (min-width: 640px) {
      nav button {
        width: auto;
        text-align: center;
        padding: 0.5rem 1rem;
      }
    }

    nav button.active {
      color: var(--text);
      border-color: var(--border);
      background: rgba(255, 255, 255, 0.05);
    }

    main {
      max-width: 1000px;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
    }

    h1, h2, h3 {
      margin-bottom: 0.5rem;
    }

    p.muted {
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    button, .button {
      display: inline-block;
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
      transition: background 0.2s;
      min-height: 38px;
    }

    button:hover, .button:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    button.primary, .button.primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    button.primary:hover, .button.primary:hover {
      background: var(--primary-hover);
    }

    button.btn-sm {
      min-height: 32px;
      padding: 0.25rem 0.6rem;
      font-size: 0.85rem;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      flex-direction: column;
      margin-top: 1rem;
    }

    @media (min-width: 480px) {
      .actions {
        flex-direction: row;
        flex-wrap: wrap;
      }
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 320px;
    }

    th, td {
      padding: 0.75rem 0.5rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .score-input {
      width: 50px !important;
      margin-bottom: 0 !important;
      text-align: center;
      padding: 0.3rem !important;
      font-size: 0.95rem;
    }

    .game-row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
    }

    @media (min-width: 520px) {
      .game-row {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .score-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .round-header {
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .round-header h3 {
      margin-bottom: 0;
      color: var(--text);
    }

    .bye-badge {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="brand">
        <h1 style="font-size: 1.25rem;">Tournament Manager</h1>
        <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle Navigation">☰</button>
      </div>
      <nav id="nav"></nav>
    </div>
  </header>

  <main id="view"></main>

  <script>
    const DEFAULT_JSON_PATH = "./tournament_data.json";

    let data = null;
    let currentView = "home";
    let menuOpen = false;

    function $(selector) {
      return document.querySelector(selector);
    }

    function esc(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toggleMenu() {
      menuOpen = !menuOpen;
      const nav = $("#nav");
      if (nav) {
        if (menuOpen) nav.classList.add("open");
        else nav.classList.remove("open");
      }
    }

    async function loadFromDefaultJSON() {
      try {
        const res = await fetch(DEFAULT_JSON_PATH);
        if (!res.ok) {
          throw new Error("Could not locate default JSON");
        }
        data = await res.json();
        save();
      } catch (err) {
        console.error("Failed to load default JSON file:", err);
      }
    }

    function loadFromLocalStorage() {
      const stored = localStorage.getItem("tournament_data");
      if (stored) {
        try {
          data = JSON.parse(stored);
        } catch (e) {
          console.error("Error parsing localStorage data:", e);
        }
      }
    }

    function save() {
      if (data) {
        localStorage.setItem("tournament_data", JSON.stringify(data));
      } else {
        localStorage.removeItem("tournament_data");
      }
      render();
    }

    async function init() {
      loadFromLocalStorage();
      if (!data) {
        await loadFromDefaultJSON();
      }
      render();
    }

    async function resetToDefaultJSON() {
      await loadFromDefaultJSON();
      render();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          data = JSON.parse(e.target.result);
          save();
          go("home");
        } catch (err) {
          alert("Invalid JSON file selected.");
        }
      };
      reader.readAsText(file);
    }

    function go(view) {
      currentView = view;
      menuOpen = false;
      render();
    }

    function renderNav() {
      const nav = $("#nav");
      nav.innerHTML = `
        <button class="${currentView === 'home' ? 'active' : ''}" onclick="go('home')">Home</button>
        <button class="${currentView === 'schedule' ? 'active' : ''}" onclick="go('schedule')">Schedule</button>
        <button class="${currentView === 'standings' ? 'active' : ''}" onclick="go('standings')">Standings</button>
        <button class="${currentView === 'data' ? 'active' : ''}" onclick="go('data')">Data / Import</button>
      `;

      if (menuOpen) nav.classList.add("open");
      else nav.classList.remove("open");
    }

    function saveScore(gameId) {
      const homeVal = $(`#home-score-${gameId}`).value.trim();
      const awayVal = $(`#away-score-${gameId}`).value.trim();
      
      const game = data.games.find(function(g) { return g.id === gameId; });
      if (game) {
        game.homeScore = homeVal !== "" && !isNaN(homeVal) ? parseInt(homeVal, 10) : null;
        game.awayScore = awayVal !== "" && !isNaN(awayVal) ? parseInt(awayVal, 10) : null;
        save();
      }
    }

    function clearScore(gameId) {
      const game = data.games.find(function(g) { return g.id === gameId; });
      if (game) {
        game.homeScore = null;
        game.awayScore = null;
        save();
      }
    }

    function renderHome() {
      if (!data) {
        $("#view").innerHTML = `
          <div class="card">
            <h2>Create or load a tournament</h2>
            <p class="muted">Manage a round-robin tournament in your browser.</p>
            <div class="actions">
              <button class="primary" onclick="showCreate()">New tournament</button>
              <label class="button">
                Import JSON
                <input type="file" accept=".json,application/json" onchange="importJSON(event)" hidden>
              </label>
              <button onclick="resetToDefaultJSON()">Reload JSON</button>
            </div>
          </div>`;
        return;
      }

      const completed = data.games ? data.games.filter(function(g) { return g.homeScore !== null && g.awayScore !== null; }).length : 0;
      const totalGames = data.games ? data.games.length : 0;
      const isComplete = allRRComplete();

      $("#view").innerHTML = `
        <div class="grid">
          <div class="card">
            <h2>${esc(data.name)}</h2>
            <p>${data.teams ? data.teams.length : 0} teams · ${totalGames} games</p>
            <p>${completed}/${totalGames} round-robin games completed.</p>
            <div class="actions">
              <button class="primary" onclick="go('schedule')">Enter scores</button>
              <button onclick="go('standings')">View standings</button>
              <button onclick="showCreate()">New tournament</button>
            </div>
          </div>
          <div class="card">
            <h3>Round-robin stage</h3>
            <p>${data.roundRobinComplete ? "Status: <strong>Completed</strong>" : "Status: <strong>In progress</strong>"}</p>
            <div class="actions">
              <button class="primary" onclick="completeRR()" ${data.roundRobinComplete || !isComplete ? "disabled" : ""}>
                Mark round robin complete
              </button>
            </div>
          </div>
        </div>`;
    }

    function showCreate() {
      $("#view").innerHTML = `
        <div class="card">
          <h2>Create New Tournament</h2>
          <label style="display:block; margin-bottom:0.25rem; font-weight:500;">Tournament Name</label>
          <input type="text" id="t-name" placeholder="e.g. Summer Championship">
          <label style="display:block; margin-bottom:0.25rem; font-weight:500;">Team Names (one per line)</label>
          <textarea id="t-teams" style="height:120px; margin-bottom:1rem;"></textarea>
          <div class="actions">
            <button class="primary" onclick="createTournament()">Create</button>
            <button onclick="render()">Cancel</button>
          </div>
        </div>`;
    }

    function createTournament() {
      const name = $("#t-name").value.trim() || "Untitled Tournament";
      const teamsText = $("#t-teams").value.trim();
      const teams = teamsText.split("\n").map(function(t) { return t.trim(); }).filter(Boolean);

      if (teams.length < 2) {
        alert("Please enter at least 2 teams.");
        return;
      }

      const games = [];
      let gameId = 1;
      for (let i = 0; i < teams.length; i++) {
        for (let j = i + 1; j < teams.length; j++) {
          games.push({
            id: gameId++,
            home: teams[i],
            away: teams[j],
            homeScore: null,
            awayScore: null
          });
        }
      }

      data = { name, teams, games, roundRobinComplete: false };
      save();
      go("schedule");
    }

    function allRRComplete() {
      if (!data || !data.games || data.games.length === 0) return false;
      return data.games.every(function(g) { return g.homeScore !== null && g.awayScore !== null; });
    }

    function completeRR() {
      if (!data) return;
      data.roundRobinComplete = true;
      save();
    }

    function generateRounds(teamsList) {
      const list = teamsList.slice();
      if (list.length % 2 !== 0) list.push("BYE");

      const n = list.length;
      const totalRounds = n - 1;
      const rounds = [];

      for (let r = 0; r < totalRounds; r++) {
        const roundData = { roundNumber: r + 1, matches: [], byeTeam: null };
        for (let i = 0; i < n / 2; i++) {
          const home = list[i];
          const away = list[n - 1 - i];

          if (home === "BYE") roundData.byeTeam = away;
          else if (away === "BYE") roundData.byeTeam = home;
          else roundData.matches.push({ home: home, away: away });
        }
        rounds.push(roundData);
        list.splice(1, 0, list.pop());
      }
      return rounds;
    }

    function renderSchedule() {
      if (!data || !data.games || !data.teams) {
        $("#view").innerHTML = `
          <div class="card">
            <h2>Schedule</h2>
            <p class="muted">No tournament data available.</p>
            <div class="actions">
              <button class="primary" onclick="showCreate()">New Tournament</button>
            </div>
          </div>`;
        return;
      }

      const generatedRounds = generateRounds(data.teams);
      let html = '<div class="card"><h2>Schedule</h2>';

      generatedRounds.forEach(function(r) {
        const byeHtml = r.byeTeam ? '<span class="bye-badge">Bye: <strong>' + esc(r.byeTeam) + '</strong></span>' : '';
        html += '<div class="round-header"><h3>Round ' + r.roundNumber + '</h3>' + byeHtml + '</div>';

        r.matches.forEach(function(m) {
          const game = data.games.find(function(g) {
            return (g.home === m.home && g.away === m.away) || (g.home === m.away && g.away === m.home);
          });

          if (game) {
            const hVal = game.homeScore !== null ? game.homeScore : '';
            const aVal = game.awayScore !== null ? game.awayScore : '';
            
            html += `
              <div class="game-row">
                <span style="font-weight: 500;">${esc(game.home)} vs ${esc(game.away)}</span>
                <div class="score-controls">
                  <input type="number" id="home-score-${game.id}" class="score-input" value="${hVal}" placeholder="-">
                  <span>:</span>
                  <input type="number" id="away-score-${game.id}" class="score-input" value="${aVal}" placeholder="-">
                  <button class="primary btn-sm" onclick="saveScore(${game.id})">Save</button>
                  ${(hVal !== '' || aVal !== '') ? `<button class="btn-sm" onclick="clearScore(${game.id})">Reset</button>` : ''}
                </div>
              </div>
            `;
          }
        });
      });

      html += '</div>';
      $("#view").innerHTML = html;
    }

    function renderStandings() {
      if (!data || !data.teams || !data.games) {
        $("#view").innerHTML = `
          <div class="card">
            <h2>Standings</h2>
            <p class="muted">No tournament data loaded yet.</p>
          </div>`;
        return;
      }

      const stats = {};
      data.teams.forEach(function(t) {
        stats[t] = { played: 0, wins: 0, losses: 0, ties: 0, points: 0 };
      });

      data.games.forEach(function(g) {
        if (g.homeScore !== null && g.awayScore !== null) {
          if (stats[g.home]) stats[g.home].played++;
          if (stats[g.away]) stats[g.away].played++;

          if (g.homeScore > g.awayScore) {
            if (stats[g.home]) { stats[g.home].wins++; stats[g.home].points += 3; }
            if (stats[g.away]) { stats[g.away].losses++; }
          } else if (g.awayScore > g.homeScore) {
            if (stats[g.away]) { stats[g.away].wins++; stats[g.away].points += 3; }
            if (stats[g.home]) { stats[g.home].losses++; }
          } else {
            if (stats[g.home]) { stats[g.home].ties++; stats[g.home].points += 1; }
            if (stats[g.away]) { stats[g.away].ties++; stats[g.away].points += 1; }
          }
        }
      });

      const sorted = Object.keys(stats).sort(function(a, b) { return stats[b].points - stats[a].points; });

      let html = `
        <div class="card">
          <h2>Standings</h2>
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Team</th>
                  <th>P</th>
                  <th>W</th>
                  <th>D</th>
                  <th>L</th>
                  <th>Pts</th>
                </tr>
              </thead>
              <tbody>`;

      sorted.forEach(function(team) {
        const s = stats[team];
        html += `
          <tr>
            <td><strong>${esc(team)}</strong></td>
            <td>${s.played}</td>
            <td>${s.wins}</td>
            <td>${s.ties}</td>
            <td>${s.losses}</td>
            <td><strong>${s.points}</strong></td>
          </tr>`;
      });

      html += '</tbody></table></div></div>';
      $("#view").innerHTML = html;
    }

    function renderDataView() {
      $("#view").innerHTML = `
        <div class="card">
          <h2>Data Management</h2>
          <p class="muted">Export or import your tournament data as a JSON file.</p>
          <div class="actions">
            <button class="primary" onclick="exportJSON()">Export JSON</button>
            <label class="button">
              Import JSON
              <input type="file" accept=".json,application/json" onchange="importJSON(event)" hidden>
            </label>
            <button onclick="resetToDefaultJSON()">Reset JSON</button>
          </div>
        </div>
      `;
    }

    function exportJSON() {
      if (!data) return;
      const str = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", str);
      downloadAnchor.setAttribute("download", `${(data.name || 'tournament').toLowerCase().replace(/\s+/g, '_')}_data.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function render() {
      renderNav();
      if (currentView === "home") renderHome();
      else if (currentView === "schedule") renderSchedule();
      else if (currentView === "standings") renderStandings();
      else if (currentView === "data") renderDataView();
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
